[plugin]
id = "amkin.delisted-capsule-fix"
name = "Delisted & Region-Locked Games - Restore Images"
version = "1.0.0"
author = "amkin_1"
description = "Restores missing images of delisted and region-locked games on Steam profile pages: profile showcases, game list and achievements."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
# auto = find the Millennium installation and install the plugin there
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"
